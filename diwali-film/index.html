{

{

    ctx.restore();

window.renderFrame=function(t){
  t=clamp(t,0,window.duration);

  master.seek(t,false);
  const a=actx;a.setTransform(1,0,0,1,0,0);a.globalAlpha=1;a.clearRect(0,0,W,H);
  const scene=scenes.find(s=>t>=s.start&&t<s.end)||scenes[scenes.length-1];
  const local=t-scene.start;
  const pulse=1+0.03*Math.max(0,1-local/0.12);
  // The painting sits in the upper part of the sheet; the handwritten caption lives below it.
  a.save();a.beginPath();a.rect(30,30,W-60,H-60);a.clip(); // paint stays on the sheet, never on the mount
  a.translate(540,470);a.scale(.87*pulse,.87*pulse);a.translate(-540,-540);
  scene.draw(a,scene.state,local);
  a.restore();
  if(captions)drawCaption(a,t);
  composite(ctx);
};
window.scenes=scenes;
window.master=master;

/* APP */
if(renderMode)document.body.classList.add('render');

async function init(){
  await Promise.all([document.fonts.load('500 42px "IBM Plex Mono"'),document.fonts.load('42px "Tiro Devanagari Sanskrit"'),document.fonts.load('42px "Pinyon Script"')]);
  buildPaper();
  await document.fonts.ready;
  ctx.font='16px "IBM Plex Mono",monospace';
  // build master already
  if(!renderMode){
    const playBtn=document.getElementById('play');
    const scrub=document.getElementById('scrub');
    const time=document.getElementById('time');
    const beats=document.getElementById('beats');
    const audioBtn=document.getElementById('audioBtn');
    let playing=false;
    function format(t){const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0')}
    function updateUI(t){scrub.value=t;time.textContent=format(t)}
        const vo=document.getElementById('vo');let voOk=false;vo.addEventListener('canplaythrough',()=>{voOk=true},{once:true});vo.addEventListener('error',()=>{voOk=false});
    let clock0=0,t0=0;
    function setPlaying(on){playing=on;playBtn.textContent=on?'Pause':'Play';if(on){t0=master.time();if(t0>=window.duration-.05)t0=0;clock0=performance.now();if(voOk){vo.currentTime=t0;vo.play().catch(()=>{})}gsap.ticker.add(tick)}else{gsap.ticker.remove(tick);vo.pause()}}
    playBtn.addEventListener('click',()=>setPlaying(!playing));
    function tick(){let t=voOk&&!vo.paused?vo.currentTime:t0+(performance.now()-clock0)/1000;if(t>=window.duration){t=0;t0=0;clock0=performance.now();if(voOk){vo.currentTime=0;vo.play().catch(()=>{})}}renderFrame(t);updateUI(t)}
    scrub.addEventListener('input',e=>{const t=+e.target.value;if(playing)setPlaying(false);renderFrame(t);updateUI(t)});
    scenes.forEach((sc,i)=>{const b=document.createElement('button');b.textContent=sc.id;b.addEventListener('click',()=>{if(playing)setPlaying(false);renderFrame(sc.start);updateUI(sc.start)});beats.appendChild(b)});
    audioBtn.addEventListener('click',async()=>{audioBtn.disabled=true;audioBtn.textContent='Rendering...';try{const wav=await window.KarmaAudio.renderWav();const url=URL.createObjectURL(wav);const a=document.createElement('a');a.href=url;a.download='audio.wav';a.click();URL.revokeObjectURL(url);audioBtn.textContent='Download audio'}catch(e){audioBtn.textContent='Audio error';console.error(e)}finally{audioBtn.disabled=false}});
    // initial
    renderFrame(0);updateUI(0);
  } else {
    renderFrame(0);
  }
}
window.ready=init().then(()=>true);
</script>
