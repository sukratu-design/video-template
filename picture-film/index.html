<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>picture-film</title>
<style>
  @font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:block;src:url('./fonts/ibm-plex-mono-500.ttf') format('truetype')}
  @font-face{font-family:'Tiro Devanagari Sanskrit';font-style:normal;font-weight:400;font-display:block;src:url('./fonts/tiro-devanagari-sanskrit-400.ttf') format('truetype')}
  @font-face{font-family:'Pinyon Script';font-style:normal;font-weight:400;font-display:block;src:url('./fonts/pinyon-script-400.ttf') format('truetype')}
  :root{color-scheme:dark;--ink:#e9e2d2;--panel:#17171c;--green:#3be38a}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101014;color:var(--ink);font-family:"IBM Plex Mono",monospace}
  body{display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
  #stage{width:min(100vw,100vh);height:min(100vw,100vh);display:grid;place-items:center;background:#0c0c18}
  canvas{display:block;width:100%;height:100%;object-fit:contain;background:#f3e6cc}
  #ui{width:min(1080px,100%);padding:12px 16px 22px;background:var(--panel);border-top:1px solid #323238}
  #transport{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
  button{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:#25252c;border:1px solid #41414b;border-radius:3px;padding:8px 12px;cursor:pointer}
  button:hover,button:focus-visible{border-color:var(--green);outline:none}
  input[type=range]{width:100%;accent-color:var(--green)}#time{font-size:12px;color:#cbc8bf;min-width:92px;text-align:right}
  #beats{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}#beats button{padding:5px 8px;font-size:10px;color:#aaa8a1}
  body.render #ui{display:none}body.render{background:#0c0c18;overflow:hidden}body.render #stage{width:1080px;height:1080px}
  @media(min-aspect-ratio:1/1){body:not(.render) #stage{height:calc(100vh - 122px);width:calc(100vh - 122px)}}
</style>
</head>
<body>
<div id="stage"><canvas id="film" width="1080" height="1080"></canvas></div>
<audio id="vo" preload="auto"></audio><audio id="music" preload="auto"></audio>
<div id="ui">
  <div id="transport"><button id="play" type="button">Play</button><input id="scrub" type="range" min="0" max="60" step="0.0333333333" value="0" aria-label="Timeline"><span id="time">00:00.00</span></div>
  <div id="beats"></div>
</div>
<script>
'use strict';
/* picture-film engine. Generic: everything about a particular film comes from
   <film>/content.js (window.FILM, hand-written) and <film>/timing.js (window.TIMING, written by voiceover/vo.mjs).
   Open as index.html?film=films/<slug>   (&render=1 for the renderer, &captions=0 to hide captions, &guides=1 for margin guides).
   Do not edit this file for a new film. */
const W=1080,H=1080;
const INK='#2A1C14',UMBER='#6A4426',PENCIL='#8A847C',PAPER='#EDE3CE',GROUND='238,226,202';
const SCRIPT='"Pinyon Script", cursive',DEVA='"Tiro Devanagari Sanskrit", serif';
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t)};
const query=new URLSearchParams(location.search),renderMode=query.get('render')==='1',captions=query.get('captions')!=='0',guides=query.get('guides')==='1';
const filmDir=(query.get('film')||'films/dussehra-diwali').replace(/\/+$/,'');
if(renderMode)document.body.classList.add('render');
const canvas=document.getElementById('film'),ctx=canvas.getContext('2d',{alpha:false});
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('missing '+src));document.head.appendChild(s)});
const loadImage=src=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>{im.decode?im.decode().then(()=>res(im),()=>res(im)):res(im)};im.onerror=()=>rej(new Error('missing '+src));im.src=src});
let F,T,B,FILM,LEAD,XF,CAM,IMGS=[],COVER=null,cues,titleOut,closingAt;

/* Camera: zoom and focus per beat, eased over the beat, clamped so the frame never leaves the painting. */
function camAt(i,t){const c=CAM[i],u=ease((t-B[i])/(B[i+1]-B[i]));return{z:lerp(c.from[0],c.to[0],u),x:lerp(c.from[1],c.to[1],u),y:lerp(c.from[2],c.to[2],u)}}
function drawPainting(i,t,alpha){const img=IMGS[i];if(!img||alpha<=0)return;const c=camAt(i,clamp(t,B[i],B[i+1]));const s=W*c.z;let ox=W/2-c.x*s,oy=H/2-c.y*s;ox=Math.min(0,Math.max(W-s,ox));oy=Math.min(0,Math.max(H-s,oy));ctx.save();ctx.globalAlpha=alpha;ctx.imageSmoothingQuality='high';ctx.drawImage(img,ox,oy,s,s);ctx.restore()}
/* Captions: handwritten copperplate in ink, written on left to right, on a soft paper-coloured ground. */
function wrapText(text,max){if(ctx.measureText(text).width>max){const w=text.split(' ');let best=null;for(let k=1;k<w.length;k++){const a=w.slice(0,k).join(' '),b=w.slice(k).join(' '),m=Math.max(ctx.measureText(a).width,ctx.measureText(b).width);if(m<=max&&(!best||m<best.m))best={m,l:[a,b]}}if(best)return best.l}const words=text.split(' '),lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>max&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines}
function captionLayout(text){let size=54;ctx.font=`${size}px ${SCRIPT}`;let lines=wrapText(text,930);if(lines.length>2){size=46;ctx.font=`${size}px ${SCRIPT}`;lines=wrapText(text,960)}return{size,lines}}
function captionGround(a){if(a<=0)return;const g=ctx.createLinearGradient(0,850,0,1080);g.addColorStop(0,`rgba(${GROUND},0)`);g.addColorStop(.35,`rgba(${GROUND},${.82*a})`);g.addColorStop(1,`rgba(${GROUND},${.9*a})`);ctx.save();ctx.fillStyle=g;ctx.fillRect(0,850,W,230);ctx.restore()}
function drawCaption(t){const cue=cues.find(l=>t>=l[0]&&t<l[1]);if(!cue)return;ctx.save();ctx.textBaseline='alphabetic';ctx.textAlign='left';const {size,lines}=captionLayout(cue[2]);const lh=size*.98,base=lines.length>1?958:996,widths=lines.map(l=>ctx.measureText(l).width),total=widths.reduce((a,b)=>a+b,0),reveal=clamp((t-cue[0])/Math.min(.6,(cue[1]-cue[0])*.4));let acc=0;lines.forEach((l,i)=>{const w=widths[i],x=540-w/2,y=base+i*lh,q=clamp((reveal*total-acc)/w);acc+=w;if(q<=0)return;ctx.save();ctx.beginPath();ctx.rect(x-30,y-size*1.2,(w+60)*q,size*1.8);ctx.clip();ctx.fillStyle=INK;ctx.fillText(l,x,y);ctx.restore()});ctx.restore()}
function text(str,x,y,{size=44,font=SCRIPT,color=INK,alpha=1,align='center',maxWidth=0}={}){if(alpha<=0||!str)return;ctx.save();ctx.globalAlpha=alpha;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillStyle=color;ctx.font=`${size}px ${font}`;if(maxWidth){const w=ctx.measureText(str).width;if(w>maxWidth)ctx.font=`${Math.floor(size*maxWidth/w)}px ${font}`}ctx.fillText(str,x,y);ctx.restore()}
function topGround(h,a){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,`rgba(${GROUND},${.85*a})`);g.addColorStop(1,`rgba(${GROUND},0)`);ctx.fillStyle=g;ctx.fillRect(0,0,W,h)}
function renderFilm(t){
  t=clamp(t,0,FILM);
  ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);
  const n=B.length-1;let i=B.findIndex((s,k)=>k<n&&t>=s&&t<B[k+1]);if(i<0)i=n-1;
  if(i>0&&t<B[i]+XF/2){drawPainting(i-1,t,1);drawPainting(i,t,ease((t-(B[i]-XF/2))/XF))}
  else if(i<n-1&&t>B[i+1]-XF/2){drawPainting(i,t,1);drawPainting(i+1,t,ease((t-(B[i+1]-XF/2))/XF))}
  else drawPainting(i,t,1);
  if(t<.8){ctx.save();ctx.globalAlpha=1-ease(t/.8);ctx.fillStyle=PAPER;ctx.fillRect(0,0,W,H);ctx.restore()} // fade in from paper
  if(F.title){const a=Math.min(ease((t-.15)/.8),1-ease((t-titleOut)/.9));if(a>0){topGround(250,a);text(F.title.text,540,118,{size:96,alpha:a,maxWidth:980});text(F.title.sub,540,170,{size:42,color:UMBER,alpha:a,maxWidth:900})}}
  if(F.closing){const a=ease((t-closingAt)/1.2);if(a>0){topGround(230,a);const deva=F.closing.font==='deva';text(F.closing.text,540,128,{size:deva?80:92,font:deva?DEVA:SCRIPT,alpha:a,maxWidth:980});text(F.closing.credit,1040,1052,{size:28,color:PENCIL,alpha:a*.9,align:'right'})}}
  if(captions){const cue=cues.find(l=>t>=l[0]-.3&&t<l[1]+.3);captionGround(cue?clamp(Math.min(t-(cue[0]-.3),cue[1]+.3-t)/.3):0);drawCaption(t)}
  if(guides){ctx.save();ctx.strokeStyle='rgba(220,40,40,.8)';ctx.lineWidth=2;ctx.setLineDash([10,8]);ctx.strokeRect(0,0,W,250);ctx.strokeRect(0,850,W,230);ctx.restore()}
}
/* Frame time t includes the cover lead: the cover holds, then dissolves as the film fades in. */
window.renderFrame=function(t){
  t=clamp(t,0,window.duration);
  renderFilm(Math.max(0,t-LEAD));
  if(COVER&&t<LEAD){const a=1-ease((t-(LEAD-.5))/.5);ctx.save();ctx.globalAlpha=a;ctx.drawImage(COVER,0,0,W,H);ctx.restore()}
};
/* For check.mjs: caption sizes/line counts, and simple pixel statistics of each painting's margins. */
window.captionReport=()=>cues.map(c=>{const {size,lines}=captionLayout(c[2]);return{text:c[2],size,lines:lines.length}});
window.frameReport=()=>IMGS.map(img=>{const n=256,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,n,n);
  const stat=(y0,y1)=>{const d=x.getImageData(0,Math.round(y0*n),n,Math.max(1,Math.round((y1-y0)*n))).data;let s=[0,0,0],q=0,m=d.length/4;for(let i=0;i<d.length;i+=4){s[0]+=d[i];s[1]+=d[i+1];s[2]+=d[i+2]}s=s.map(v=>v/m);for(let i=0;i<d.length;i+=4)q+=(d[i]-s[0])**2+(d[i+1]-s[1])**2+(d[i+2]-s[2])**2;return{rgb:s.map(Math.round),sd:Math.sqrt(q/m/3)}};
  return{w:img.naturalWidth,h:img.naturalHeight,top:stat(0,.12),bottom:stat(.85,1),corner:stat(0,.04)}});
async function init(){
  await loadScript(filmDir+'/content.js');await loadScript(filmDir+'/timing.js');
  F=window.FILM;T=window.TIMING;B=T.beats;FILM=T.film;LEAD=F.lead||0;XF=F.xfade??.7;CAM=F.beats.map(b=>b.cam);cues=T.cues;
  if(B.length!==F.beats.length+1)throw new Error(`timing.js has ${B.length-1} beats, content.js has ${F.beats.length}: re-run voiceover/vo.mjs`);
  titleOut=T.titleOut??B[1]-1.2;closingAt=T.closingAt??(cues.length?cues[cues.length-1][1]+.22:FILM-3);
  window.LEAD=LEAD;window.duration=FILM+LEAD;window.scenes=F.beats.map((b,i)=>({id:'b'+(i+1),start:B[i],end:B[i+1]}));
  document.title=F.title?F.title.text:'picture-film';
  const jobs=[document.fonts.load('42px "Tiro Devanagari Sanskrit"'),document.fonts.load('42px "Pinyon Script"'),document.fonts.load('500 12px "IBM Plex Mono"'),
    ...F.beats.map((b,i)=>loadImage(filmDir+'/'+b.image).then(im=>{IMGS[i]=im}))];
  if(LEAD>0&&F.cover)jobs.push(loadImage(filmDir+'/'+F.cover).then(im=>{COVER=im},()=>{console.warn('cover image missing: run cover.mjs')})); // check.mjs fails a film whose cover is missing
  await Promise.all(jobs);await document.fonts.ready;
  if(!renderMode){
    const playBtn=document.getElementById('play'),scrub=document.getElementById('scrub'),time=document.getElementById('time'),beats=document.getElementById('beats');
    scrub.max=window.duration;
    let playing=false,clock0=0,t0=0,cur=0;
    const fmt=t=>{const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0')};
    const upd=t=>{cur=t;scrub.value=t;time.textContent=fmt(t)};
    const tracks=['vo','music'].map(id=>{const a=document.getElementById(id);const o={a,ok:false};a.addEventListener('canplaythrough',()=>{o.ok=true},{once:true});a.src=filmDir+'/'+id+'.mp3';if(id==='music')a.volume=.3;return o});
    const sync=t=>tracks.forEach(o=>{if(o.ok&&t>=LEAD&&o.a.paused&&t<window.duration-.1){o.a.currentTime=t-LEAD;o.a.play().catch(()=>{})}});
    function tick(){if(!playing)return;let t=t0+(performance.now()-clock0)/1000;if(t>=window.duration){t=0;t0=0;clock0=performance.now();tracks.forEach(o=>o.a.pause())}sync(t);renderFrame(t);upd(t);requestAnimationFrame(tick)}
    function setPlaying(on){playing=on;playBtn.textContent=on?'Pause':'Play';if(on){t0=cur>=window.duration-.05?0:cur;clock0=performance.now();requestAnimationFrame(tick)}else tracks.forEach(o=>o.a.pause())}
    playBtn.addEventListener('click',()=>setPlaying(!playing));
    scrub.addEventListener('input',e=>{const t=+e.target.value;if(playing)setPlaying(false);renderFrame(t);upd(t)});
    window.scenes.forEach(sc=>{const b=document.createElement('button');b.textContent=sc.id;b.addEventListener('click',()=>{if(playing)setPlaying(false);renderFrame(LEAD+sc.start+.4);upd(LEAD+sc.start+.4)});beats.appendChild(b)});
    upd(0);
  }
  renderFrame(0);
}
window.ready=init().then(()=>true);
</script>
</body>
</html>
