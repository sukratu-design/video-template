<!doctype html>
<html><head><meta charset="utf-8">
<title>MyDesigner Launch</title>
<style>
@font-face{font-family:SG;font-weight:400;src:url(node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-400-normal.woff2)}
@font-face{font-family:SG;font-weight:500;src:url(node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:SG;font-weight:600;src:url(node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-600-normal.woff2)}
@font-face{font-family:SG;font-weight:700;src:url(node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:SM;font-weight:400;src:url(node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2)}
@font-face{font-family:FR;font-weight:600;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2)}
@font-face{font-family:FR;font-weight:600;font-style:italic;src:url(node_modules/@fontsource/fraunces/files/fraunces-latin-600-italic.woff2)}
:root{--paper:#f3ede8;--grid:#e6ddd4;--board:#fbf9f6;--orange:#fe883d;--deep:#ff6410;--ink:#0c0c0c;--red:#e0452f;--muted:#8d847c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
#stage{position:absolute;inset:0;overflow:hidden;font-family:SG;color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:80px 80px;background-position:-1px -1px}
.abs{position:absolute}
.layer{position:absolute;inset:0}
.mono{font-family:SM;text-transform:uppercase;letter-spacing:.15em}

/* intro */
#intro{left:0;right:0;top:500px;text-align:center;font-size:64px;font-weight:500}
#intro span{display:inline-block}

/* board */
.persp{position:absolute;inset:0;perspective:2200px}
.board{position:absolute;width:1604px;height:912px;background:var(--board);border-radius:28px;
  box-shadow:0 2px 0 rgba(0,0,0,.03),0 30px 60px -20px rgba(60,40,20,.18),0 0 0 1px rgba(0,0,0,.04);transform-origin:50% 50%}
.b-title{left:46px;top:44px;font-size:36px;font-weight:500;display:flex;align-items:center;gap:20px}
.pill{font-family:SM;font-size:18px;letter-spacing:.15em;background:#efe8e1;color:#857b72;padding:4px 12px;border-radius:999px}
.sub{font-family:SM;font-size:18px;letter-spacing:.15em;color:#857b72}
.toggle{right:32px;top:40px;background:#efe8e1;border-radius:999px;padding:5px;display:flex;gap:4px;font-size:18px;color:#8d847c}
.toggle div{padding:6px 16px;border-radius:999px}
.toggle .on{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.day{top:128px;font-family:SM;font-size:20px;letter-spacing:.18em}
.hr{left:100px;right:14px;height:1px;background:#ece5de}
.vr{top:166px;bottom:20px;width:1px;background:#ece5de}
.time{left:30px;width:52px;text-align:right;font-family:SM;font-size:15px;color:#8d847c}
.card{position:absolute;width:282px;height:33px;border-radius:7px;display:flex;align-items:flex-start;justify-content:space-between;
  padding:5px 12px 0 20px;font-size:19px;font-weight:500;border:1px solid rgba(0,0,0,.05)}
.card::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--bar)}
.card .t{font-family:SM;font-size:15px;color:var(--bar);padding-top:2px}
.c-green{background:#dfece2;--bar:#4f9a6c}.c-peach{background:#fbe2d4;--bar:#e07a4a}.c-blue{background:#dde7f4;--bar:#4f7fc4}
.c-purple{background:#e7e2f5;--bar:#8a6fd0}.c-yellow{background:#f6edcb;--bar:#c29b1c}.c-pink{background:#f5dce4;--bar:#c75a7c}.c-grey{background:#e9e4de;--bar:#8a7f74}
.block{position:absolute;width:282px;height:224px;border-radius:10px;background:var(--orange);padding:18px 20px;color:var(--ink)}
.block h4{font-size:40px;font-weight:600;line-height:1}
.block .mono{font-size:16px;letter-spacing:.22em;margin-top:8px;color:#3a1e0c}
.block .tt{position:absolute;left:20px;bottom:12px;font-family:SM;font-size:16px;color:#3a1e0c}
.counter{right:350px;top:34px;text-align:right;font-family:SM;font-size:20px;letter-spacing:.2em;line-height:1.15}

/* notifications */
.notif{position:absolute;width:410px;height:84px;background:#fff;border-radius:16px;box-shadow:0 18px 40px -12px rgba(40,25,10,.25),0 0 0 1px rgba(0,0,0,.04);
  display:flex;align-items:center;gap:16px;padding:0 18px}
.notif .ic{width:40px;height:40px;border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:600;font-size:20px;flex:none}
.notif .tx{flex:1;font-size:18px;line-height:1.35;white-space:nowrap}
.notif .tx b{font-weight:600;font-size:17px}
.notif .now{position:absolute;right:18px;top:14px;font-size:13px;color:#8d847c}

/* captions */
#caps{left:0;right:0;top:497px;display:flex;justify-content:center;gap:14px}
#caps div{background:#0b0908;color:#f3ede8;font-weight:600;font-size:96px;line-height:92px;padding:0 24px}
#tiles{left:0;top:0;width:1920px;height:1080px}
#tiles i{position:absolute;width:80px;height:80px;background:var(--paper);border-right:1px solid var(--grid);border-bottom:1px solid var(--grid)}

/* shipped */
.tag{font-family:SM;font-size:28px;letter-spacing:.25em;padding:6px 14px;background:var(--orange);color:#2a160a;font-weight:400}
.tag::after{content:"";position:absolute;right:-8px;top:-8px;width:10px;height:10px;border-top:2px solid #2a160a;border-right:2px solid #2a160a}

/* orange world */
#orange{background:var(--orange)}
.sphere{position:absolute;border-radius:50%}
#tagline{left:0;right:0;top:676px;text-align:center;font-family:SM;font-size:26px;letter-spacing:.32em;color:#1a0c04}

/* prompt bar */
#bar{position:absolute;left:580px;width:760px;height:60px;top:1000px;background:#fff;border-radius:999px;box-shadow:0 14px 30px -10px rgba(40,25,10,.25);
  display:flex;align-items:center;padding:0 16px;gap:14px;font-size:22px}
#bar .go{position:absolute;right:12px;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:20px}
#barTxt.status{font-family:SM;color:#f06a1f;letter-spacing:.22em;text-transform:uppercase}

/* end */
#endline{left:0;right:0;top:410px;text-align:center;font-family:FR;font-weight:600;font-size:112px;letter-spacing:-.01em;color:#0c0c0c}
#endline span{display:inline-block}
.brk{position:absolute;width:28px;height:28px;border-color:#2a160a;border-style:solid;border-width:0}
#endurl{left:0;right:0;top:772px;text-align:center;font-family:SM;font-size:22px;letter-spacing:.3em;color:#1a0c04}
</style></head>
<body>
<div id="stage">
  <div id="intro" class="abs"><span id="w1">This is</span> <span id="w2">launch week.</span></div>

  <div class="persp" id="lwPersp"><div class="board" id="lw"></div></div>
  <div class="layer" id="notifs"></div>
  <div id="caps" class="abs"><div>Busy</div><div>weeks.</div><div>Nothing</div><div>ships.</div></div>

  <div class="layer" id="shippedGrp">
    <div class="abs" id="sgInner" style="left:0;top:0">
      <div class="abs tag" id="shipTag" style="left:0;top:0">SHIPPED</div>
      <svg class="abs" id="leader" style="left:14px;top:40px;overflow:visible" width="40" height="80"><path id="leaderPath" d="M2 0 V96 H50" fill="none" stroke="#2a160a" stroke-width="2"/></svg>
      <div class="abs" id="zeroTxt" style="left:72px;top:92px;font-size:84px;font-weight:500;white-space:nowrap"><span style="color:var(--orange)">0</span> <span id="zt"></span></div>
    </div>
  </div>
  <div class="abs" id="dot" style="background:var(--orange)"></div>

  <div class="layer" id="orange">
    <div id="spheres"></div>
    <svg class="abs" id="ring" width="180" height="180" viewBox="0 0 180 180" style="left:870px;top:450px">
      <circle cx="90" cy="90" r="83" fill="none" stroke="#0c0c0c" stroke-width="11"/>
      <circle cx="90" cy="90" r="64" fill="none" stroke="#0c0c0c" stroke-width="9"/>
      <circle cx="90" cy="90" r="50" fill="none" stroke="#0c0c0c" stroke-width="7"/>
      <circle cx="90" cy="90" r="38" fill="#0c0c0c"/>

    <div class="abs" id="wmWrap" style="left:735px;top:478px;width:674px;height:132px;overflow:hidden"><img id="wm" src="assets/wordmark.png" style="display:block"></div>

  </div>

  <div class="layer" id="shipScene">

      <div id="bar"><svg width="30" height="30" viewBox="0 0 30 30" id="barIcon"><circle cx="15" cy="15" r="13" fill="none" stroke="#f06a1f" stroke-width="2"/><circle cx="15" cy="15" r="8" fill="none" stroke="#f06a1f" stroke-width="2"/><circle cx="15" cy="15" r="4" fill="#f06a1f"/></svg><span id="barTxt"></span><span id="caret" style="width:2px;height:26px;background:#0c0c0c;margin-left:-12px"></span><div class="go">↑</div></div>
      <svg class="abs" id="tagLines" style="left:0;top:0;overflow:visible" width="1920" height="1080">
        <path id="tl1" d="M590 935 V1000" stroke="#2a160a" stroke-width="2" fill="none"/>
        <path id="tl2" d="M1302 935 V1000" stroke="#2a160a" stroke-width="2" fill="none"/>
      </svg>
      <div class="abs tag" id="tag1" style="left:448px;top:996px;font-size:18px">+1 LAUNCH SHIPPED</div>
      <div class="abs tag" id="tag2" style="left:1160px;top:996px;font-size:18px;background:#0c0c0c;color:#f3ede8">24–72H TURNAROUND</div>
    </div>
  </div>
  <div class="abs" id="takeover" style="background:var(--orange)"></div>

  <div class="layer" id="end" style="background:var(--orange)">
    <div id="spheres2"></div>
    <div class="brk" id="bk1" style="left:130px;top:382px;border-top-width:3px;border-left-width:3px"></div>
    <div class="brk" id="bk2" style="right:130px;top:382px;border-top-width:3px;border-right-width:3px"></div>
    <div class="brk" id="bk3" style="left:130px;top:524px;border-bottom-width:3px;border-left-width:3px"></div>
    <div class="brk" id="bk4" style="right:130px;top:524px;border-bottom-width:3px;border-right-width:3px"></div>
    <div id="endline" class="abs"><span>Monday,</span> <span>brief.</span> <span>Friday,</span> <span style="font-style:italic">shipped.</span></div>
    <div class="abs" id="lockup" style="left:655px;top:614px;width:610px;height:124px">
      <svg width="122" height="122" viewBox="0 0 180 180" class="abs" style="left:0;top:0">
        <circle cx="90" cy="90" r="83" fill="none" stroke="#0c0c0c" stroke-width="11"/><circle cx="90" cy="90" r="64" fill="none" stroke="#0c0c0c" stroke-width="9"/>
        <circle cx="90" cy="90" r="50" fill="none" stroke="#0c0c0c" stroke-width="7"/><circle cx="90" cy="90" r="38" fill="#0c0c0c"/></svg>
      <img src="assets/wordmark.png" class="abs" style="left:146px;top:30px;width:464px">
    </div>
    <div id="endurl" class="abs"></div>
  </div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="content.js"></script>
<script>
const C=window.CONTENT, B=C.brand;
{const r=document.documentElement.style;r.setProperty("--paper",B.paper);r.setProperty("--grid",B.grid);r.setProperty("--board",B.board);r.setProperty("--orange",B.accent);r.setProperty("--deep",B.accentDeep);r.setProperty("--ink",B.ink);r.setProperty("--red",B.alert);}
{const s=(q,t)=>document.querySelectorAll(q).forEach(e=>e.textContent=t);
 s("#w1",C.intro[0]);s("#w2",C.intro[1]);
 [...document.querySelectorAll("#caps div")].forEach((d,i)=>d.textContent=C.captions[i]||"");
 s("#shipTag",C.statTag);document.querySelector("#zeroTxt span").textContent=C.stat.number;
 s("#tag1",C.proofTags[0]);s("#tag2",C.proofTags[1]);
 document.querySelectorAll("#endline span").forEach((e,i)=>e.textContent=C.endLine[i]);
 document.querySelectorAll("img[src='assets/wordmark.png']").forEach(i=>i.src=B.wordmark);}
// ---------- helpers ----------
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const $=s=>document.querySelector(s);
const el=(tag,cls,html,parent,style)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)e.style.cssText=style;parent&&parent.appendChild(e);return e};
const COLX=d=>111+d*299, HY=h=>210+(h-9)*77;
const DAYS=C.days;

function buildBoard(b,title,sub,right){
  b.innerHTML='';
  el('div','abs b-title',`${title}<span class="pill">${C.chaosBoard.week}</span><span class="sub">${sub}</span>`,b);
  el('div','abs toggle','<div>Day</div><div class="on">Week</div><div>Month</div>',b);
  el('div','abs counter',right,b);
  DAYS.forEach((d,i)=>{el('div','abs day',d,b,`left:${COLX(i)+6}px`); if(i) el('div','abs vr','',b,`left:${COLX(i)-9}px`)});
  el('div','abs hr','',b,`top:166px;left:20px`);
  for(let h=9;h<=17;h++){el('div','abs hr','',b,`top:${HY(h)+2}px`); const l=h<12?h+'AM':h==12?'12PM':(h-12)+'PM'; el('div','abs time',l,b,`top:${HY(h)-6}px`)}
  return el('div','layer','',b);
}
function card(layer,c){
  const e=el('div','card c-'+c.c,`<span>${c.n}</span><span class="t">${c.t}</span>`,layer);
  e.style.left=(COLX(c.d)+(c.dx||0))+'px'; e.style.top=HY(c.h)+'px';
  if(c.tall) e.style.height=c.tall+'px'; if(c.w) e.style.width=c.w+'px';
  return e;
}
// 26 launch-week cards: id, day, hour, colour, name, time
const CARDS=C.cards.map(a=>a.slice());/*
 ['mon-standup',0,9.4,'green','Standup','9:00'],['mon-deck',0,9.95,'purple','Deck review','10:30'],['mon-approval',0,10.5,'grey','Approval meeting','10:30'],
 ['mon-social',0,11.0,'yellow','Social assets','11:00'],['mon-agency',0,13.9,'grey','Agency sync #4','2:00'],['mon-landing',0,14.4,'peach','Landing page v7','2:30',62],
 ['mon-brand',0,15.3,'purple','Brand audit','3:30'],
 ['tue-standup',1,9.0,'green','Standup','9:00'],['tue-logo',1,9.45,'peach','Logo feedback','9:30'],['tue-kickoff',1,9.9,'blue','Kickoff call','10:00'],
 ['tue-stake',1,13.4,'pink','Stakeholder review','2:00',48],['tue-free',1,13.95,'grey','Freelancer brief','2:30'],
 ['wed-hiring',2,9.3,'grey','Hiring: designer #3','9:30'],['wed-pitch',2,8.95,'purple','Pitch deck','9:15'],['wed-investor',2,9.75,'blue','Investor update','10:00'],
 ['wed-qa',2,10.9,'green','QA pass?','11:30'],['wed-pricing',2,11.35,'peach','Pricing page','11:45'],['wed-rebrand',2,12.0,'pink','Rebrand??','12:30',56],
 ['thu-copy',3,9.15,'yellow','Copy rewrite','10:00'],['thu-feedback',3,9.25,'blue','Feedback call','10:00',null,14],['thu-lunch',3,10.9,'yellow','Lunch & learn','12:00',46],
 ['thu-board',3,12.3,'pink','Board prep','2:00',72],
 ['fri-standup',4,8.75,'green','Standup','9:00'],['fri-asset',4,9.2,'peach','Asset export','9:30'],['fri-rev',4,9.8,'pink','Revisions, round 4','11:00'],
 ['fri-onboard',4,12.8,'green','Onboarding flow','3:00'],
*/
CARDS.splice(0,CARDS.length,...CARDS.map(a=>({id:a[0],d:a[1],h:a[2],c:a[3],n:a[4],t:a[5],tall:a[6],dx:a[7]||0})));
// final Ship Week slots (day, hour, dx, tall)
const FINAL=C.finalSlots;/*{'mon-standup':[0,16.53],'tue-standup':[1,16.53],'fri-standup':[4,16.53],'tue-kickoff':[0,13.03],'mon-deck':[0,13.53],'mon-social':[0,14.03],
 'mon-landing':[0,14.55,8,50],'mon-brand':[0,15.53],'tue-logo':[1,13.03],'tue-stake':[1,13.55,0,50],'wed-investor':[2,13.03,8],'wed-pricing':[2,13.53],
 'wed-pitch':[2,14.03,8],'thu-lunch':[3,12.04,0,50],'thu-copy':[3,13.03],'thu-board':[3,13.6,0,70],'fri-asset':[4,13.03],'fri-onboard':[4,15.03]}*/

// ---------- build DOM ----------
const lwCards=buildBoard($('#lw'),C.chaosBoard.title,C.chaosBoard.dates,'<div id="reqN">0 REQUESTS</div><div id="conN" style="color:var(--red)">0 CONFLICTS</div>');
const lwEls=CARDS.map(c=>card(lwCards,c));
C.chaosBoard.__w=C.chaosBoard.week;C.chaosBoard.week=C.planBoard.week;
const swCards=buildBoard($('#sw'),C.planBoard.title,C.planBoard.dates,'<div style="font-size:16px;color:#8d847c">'+C.planBoard.meterLabel+'</div><div id="pct" style="font-family:SG;font-size:34px;letter-spacing:0;color:var(--ink);font-weight:500">0%</div>');
$('#sw .counter').style.right='300px';
C.chaosBoard.week=C.chaosBoard.__w;
const swEls={}; CARDS.forEach(c=>swEls[c.id]=card(swCards,c));
const BLOCKS=C.planBlocks.map((b,i)=>{
  const e=el('div','block',`<h4>${b[0]}</h4><div class="mono">${b[1]}</div><div class="tt">${C.planTime}</div>`,swCards);
  e.style.left=COLX(i)+'px';e.style.top=(HY(9)+2)+'px'; if(i==4) e.style.background='var(--deep)'; return e});

const NPOS=[[1415,110,4.0,1],[-12,222,4.5,-1],[1315,545,5.0,1],[8,880,5.5,-1],[1255,952,6.0,1]];
const NOTIFS=C.notifications.map((n,i)=>[n.title,n.body,n.icon,n.color,...NPOS[i]]).map(n=>{
  const e=el('div','notif',`<div class="ic" style="background:${n[3]}">${n[2]}</div><div class="tx"><b>${n[0]}</b><br>${n[1]}</div><div class="now">now</div>`,$('#notifs'));
  e.style.left=n[4]+'px';e.style.top=n[5]+'px';return {e,t:n[6],dir:n[7]}});

// tiles
const tiles=[]; for(let y=0;y<14;y++)for(let x=0;x<24;x++){const t=el('i','','',$('#tiles'));t.style.left=x*80+'px';t.style.top=y*80+'px';tiles.push(t)}

// stippled spheres
function sphereURL(R,s){
  seed=s; const c=document.createElement('canvas');c.width=c.height=R*2;const g=c.getContext('2d');g.fillStyle='rgba(38,18,6,.92)';
  const N=R*R*0.9; const L=[-0.55,-0.6,0.58];
  for(let i=0;i<N;i++){const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*R;const x=Math.cos(a)*r,y=Math.sin(a)*r;
    const nz=Math.sqrt(Math.max(0,1-(x*x+y*y)/(R*R)));const dot=(x/R)*L[0]+(y/R)*L[1]+nz*L[2];
    let p=Math.pow(Math.max(0,1-(dot+0.25)/1.15),1.8)*0.55+0.03+Math.pow(1-nz,6)*0.35;
    if(rnd()<p){g.beginPath();g.arc(R+x,R+y,0.8+rnd()*1.1,0,7);g.fill()}}
  return c.toDataURL();
}
function addSpheres(host,list){return list.map(([x,y,R,s])=>{const e=el('div','sphere','',host);e.style.cssText+=`;width:${R*2}px;height:${R*2}px;left:${x-R}px;top:${y-R}px;background:url(${sphereURL(R,s)})`;return e})}
const sph=addSpheres($('#spheres'),[[1700,250,270,11],[1660,900,300,23],[170,920,235,37]]);
const sph2=addSpheres($('#spheres2'),[[1765,165,160,41],[1700,930,240,53],[165,930,185,67]]);

// ---------- timeline ----------
const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
const typeOn=(node,text,at,dur,cls)=>{const o={n:0};tl.to(o,{n:text.length,duration:dur,ease:'none',onUpdate:()=>{node.textContent=text.slice(0,Math.round(o.n))}},at)};

// initial states
gsap.set(['#lwPersp','#notifs','#caps','#tiles','#shippedGrp','#dot','#orange','#shipScene','#takeover','#end'],{autoAlpha:0});
gsap.set('#w1,#w2',{autoAlpha:0,y:24});

// S1 intro
tl.to('#w1',{autoAlpha:1,y:0,duration:.35},0.3).to('#w2',{autoAlpha:1,y:0,duration:.35},0.8)
  .to('#intro',{clipPath:'inset(0 0 0 100%)',duration:.35,ease:'power2.in'},1.35)
  .set('#intro',{autoAlpha:0},1.7);

// S2 launch board
const lw=$('#lw');
gsap.set(lw,{left:158,top:40,scale:.42,y:-140,transformPerspective:2200});
tl.set('#lwPersp',{autoAlpha:1},1.4)
  .from(lw,{autoAlpha:0,y:-180,duration:.5},1.4)
  .to(lw,{scale:.86,y:-30,duration:.7,ease:'power2.inOut'},1.8)
  .to(lw,{rotationX:16,rotationZ:-6,scale:1.12,x:40,y:20,duration:1.1,ease:'power2.inOut'},2.4)
  .to(lw,{scale:1.2,x:60,y:50,duration:4.2,ease:'none'},3.5);
const order=lwEls.map((e,i)=>i).sort(()=>rnd()-.5);
order.forEach((idx,k)=>{const at=3.0+k*0.12; tl.from(lwEls[idx],{autoAlpha:0,y:-26,scale:1.08,duration:.32,ease:'back.out(2)'},at)});
const cnt={r:0,c:0};
tl.to(cnt,{r:C.chaosBoard.requests,c:C.chaosBoard.conflicts,duration:3.2,ease:'none',onUpdate:()=>{$('#reqN').textContent=Math.round(cnt.r)+' REQUESTS';$('#conN').textContent=Math.round(cnt.c)+' CONFLICTS'}},3.0);
tl.set('#notifs',{autoAlpha:1},3.9);
NOTIFS.forEach(n=>tl.from(n.e,{x:n.dir*120,autoAlpha:0,scale:.92,duration:.4,ease:'back.out(1.6)'},n.t));
// jitter
for(let i=0;i<8;i++) tl.to('#lwPersp,#notifs',{x:(i%2?-1:1)*(4+rnd()*6),y:(rnd()-.5)*6,duration:.05,ease:'none'},6.55+i*.055);
tl.to('#lwPersp,#notifs',{x:0,y:0,duration:.05},7.0);
// captions
tl.set('#caps',{autoAlpha:1},7.0);
[...$('#caps').children].forEach((c,i)=>tl.from(c,{scale:1.35,autoAlpha:0,duration:.18,ease:'power4.out'},7.0+i*.12));
// shatter
tl.set('#tiles',{autoAlpha:1},7.55); gsap.set(tiles,{autoAlpha:0});
const tOrder=tiles.map((t,i)=>i).sort(()=>rnd()-.5);
tOrder.forEach((ti,k)=>{const at=7.6+k/tOrder.length*0.75; const t=tiles[ti];
  if(k%37==0){tl.set(t,{autoAlpha:1,backgroundColor:'#fe883d'},at).set(t,{backgroundColor:'#f3ede8'},at+.1)} else tl.set(t,{autoAlpha:1},at)});
tl.set(['#lwPersp','#notifs','#caps'],{autoAlpha:0},8.4).set('#tiles',{autoAlpha:0},8.42);

// S3 shipped
const sg=$('#sgInner'); gsap.set(sg,{x:860,y:410,scale:1.1,transformOrigin:'0 0'}); gsap.set('#leaderPath',{strokeDasharray:120,strokeDashoffset:120});
tl.set('#shippedGrp',{autoAlpha:1},9.0)
  .from('#shipTag',{scale:0,transformOrigin:'0% 50%',duration:.3,ease:'back.out(2.5)'},9.0)
  .to('#leaderPath',{strokeDashoffset:0,duration:.45,ease:'power2.inOut'},9.25)
  .to(sg,{x:560,y:400,duration:.8,ease:'power3.inOut'},9.4)
  .from('#zeroTxt',{autoAlpha:0,x:-14,duration:.25},9.75);
typeOn($('#zt'),C.stat.words,9.8,.25);
tl.call(()=>{},null,10.3);
const zt2={n:0};tl.to(zt2,{n:1,duration:.5,ease:'none',onUpdate:()=>{const s=C.stat.tail;$('#zt').textContent=C.stat.words+s.slice(0,Math.round(zt2.n*s.length))}},10.35)
  .to(sg,{x:510,duration:.6,ease:'power2.inOut'},10.3);
// collapse
tl.to(['#zeroTxt','#leader'],{autoAlpha:0,duration:.2},11.4)
  .to('#shipTag',{color:'rgba(0,0,0,0)',duration:.15},11.4)
  .to(sg,{x:900,y:525,duration:.45,ease:'power3.inOut'},11.45);
gsap.set('#dot',{left:960-18,top:540-18,width:36,height:36,borderRadius:'50%'});
tl.set('#shippedGrp',{autoAlpha:0},11.95).set('#dot',{autoAlpha:1},11.95)
  .from('#dot',{scaleX:3,scaleY:1.1,borderRadius:'4px',duration:.25},11.95)
  .to('#dot',{scale:75,duration:.55,ease:'power3.in'},12.15)
  .set('#orange',{autoAlpha:1},12.7).set('#dot',{autoAlpha:0},12.72);

// S4 logo
gsap.set('#ring',{scale:0,transformOrigin:'50% 50%'}); gsap.set('#wm',{x:-700}); gsap.set(sph,{autoAlpha:0});
tl.to('#ring',{scale:1,duration:.55,ease:'back.out(1.8)'},12.85);
sph.forEach((s,i)=>tl.fromTo(s,{autoAlpha:0,x:(i==2?-120:140),y:(i==0?-80:100),rotation:-10},{autoAlpha:1,x:0,y:0,rotation:0,duration:1.4,ease:'power2.out'},13.0+i*.25));
tl.to('#ring',{x:-345,duration:.65,ease:'power3.inOut'},14.35)
  .to('#wm',{x:0,duration:.65,ease:'power3.inOut'},14.4);
typeOn($('#tagline'),C.tagline,15.1,1.0);
sph.forEach((s,i)=>tl.to(s,{rotation:i%2?8:-8,y:'+=12',duration:4,ease:'none'},14.4));

// S5 iris into Ship Week
const sw=$('#sw');
gsap.set(sw,{left:158,top:40,scale:.95,transformPerspective:2200,rotationX:14,rotationZ:-6});
gsap.set('#shipScene',{clipPath:'circle(0px at 960px 540px)'});
gsap.set(['#tag1','#tag2'],{autoAlpha:0,y:16}); gsap.set(['#tl1','#tl2'],{strokeDasharray:70,strokeDashoffset:70});
gsap.set(BLOCKS,{autoAlpha:0,scale:.9,transformOrigin:'50% 0%'}); gsap.set('#bar',{autoAlpha:0,y:30});
tl.to('#wmWrap',{autoAlpha:0,duration:.2},16.65)
  .to('#ring',{x:0,duration:.35,ease:'power3.inOut'},16.7)
  .to('#tagline',{autoAlpha:0,duration:.15},17.15)
  .set('#shipScene',{autoAlpha:1},17.05)
  .to('#shipScene',{clipPath:'circle(1200px at 960px 540px)',duration:.55,ease:'power3.in'},17.05)
  .to('#ring',{scale:15,duration:.55,ease:'power3.in'},17.05)
  .set('#orange',{autoAlpha:0},17.6)
  .to(sw,{rotationX:0,rotationZ:0,duration:1.3,ease:'power2.out'},17.5)
  .to('#bar',{autoAlpha:1,y:0,duration:.4},17.85)
  .call(()=>{$('#barTxt').textContent=C.prompt.placeholder;$('#barTxt').style.color='#a59a90'},null,17.85)
  .call(()=>{$('#barTxt').style.color=''},null,18.33);
typeOn($('#barTxt'),C.prompt.text,18.35,1.35);
tl.to('#caret',{autoAlpha:0,duration:.01},19.95)
  .to('#bar .go',{scale:.85,duration:.08,yoyo:true,repeat:1},19.9)
  .call(()=>{const b=$('#barTxt');b.className='status';b.textContent=C.prompt.working;$('#bar .go').innerHTML='→'},null,20.05)
  .set('#bar .go',{backgroundColor:'#f06a1f'},20.05)
  .to('#barIcon',{rotation:720,transformOrigin:'50% 50%',duration:3,ease:'none'},20.05);
// reorganise
let k=0;
CARDS.forEach(c=>{const e=swEls[c.id];const f=FINAL[c.id];
  if(!f){const ang=rnd()*Math.PI*2;const at=20.3+(k++)*.09;tl.to(e,{x:Math.cos(ang)*2400,y:Math.sin(ang)*1400-200,rotation:(rnd()-.5)*90,duration:.7,ease:'power2.in'},at).set(e,{autoAlpha:0},at+.7)}
  else{const dx=COLX(f[0])+(f[2]||0)-(COLX(c.d)+c.dx),dy=HY(f[1])-HY(c.h);
    tl.to(e,{x:dx,y:dy,height:f[3]||e.style.height||33,duration:.75,ease:'power3.inOut'},20.9+rnd()*.5)}});
tl.call(()=>$('#barTxt').textContent=C.prompt.planning,null,21.6);
BLOCKS.forEach((b,i)=>tl.to(b,{autoAlpha:1,scale:1,duration:.3,ease:'back.out(1.6)'},22.35+i*.2));
const pc={v:0};tl.to(pc,{v:100,duration:1.0,ease:'power1.inOut',onUpdate:()=>$('#pct').textContent=Math.round(pc.v)+'%'},22.25);
tl.to('#cam',{scale:1.035,y:-10,transformOrigin:'50% 0%',duration:1.6,ease:'power2.inOut'},21.6);
tl.call(()=>$('#barTxt').textContent=C.prompt.done,null,23.0)
  .to('#bar',{y:140,autoAlpha:0,duration:.35,ease:'power2.in'},23.35)
  .to('#tl1',{strokeDashoffset:0,duration:.25},23.45).to('#tag1',{autoAlpha:1,y:0,duration:.3,ease:'back.out(2)'},23.55)
  .to('#tl2',{strokeDashoffset:0,duration:.25},23.85).to('#tag2',{autoAlpha:1,y:0,duration:.3,ease:'back.out(2)'},23.95);

// S6 takeover
gsap.set('#takeover',{left:0,top:0,width:1920,height:1080,scaleX:282/1920,scaleY:224/1080,transformOrigin:'0 0'});
tl.add(()=>{const r=BLOCKS[1].getBoundingClientRect();gsap.set('#takeover',{x:r.left,y:r.top,scaleX:r.width/1920,scaleY:r.height/1080})},24.69);
tl.set('#takeover',{autoAlpha:1},24.7)
  .to('#takeover',{x:0,y:0,scaleX:1,scaleY:1,duration:.65,ease:'power3.inOut'},24.72)
  .set('#end',{autoAlpha:1},25.4).set(['#takeover','#shipScene'],{autoAlpha:0},25.42);

// S7 end card
const words=[...$('#endline').children];
gsap.set(words,{autoAlpha:0,y:-50}); gsap.set('.brk',{autoAlpha:0,scale:1.6}); gsap.set('#lockup',{autoAlpha:0,y:40}); gsap.set(sph2,{autoAlpha:0});
sph2.forEach((s,i)=>tl.fromTo(s,{autoAlpha:0,scale:.6,x:i==2?-80:80},{autoAlpha:1,scale:1,x:0,duration:1.2,ease:'power2.out'},25.5+i*.2));
words.forEach((w,i)=>tl.to(w,{autoAlpha:1,y:0,duration:.4,ease:'back.out(1.7)'},25.6+i*.26 + (i==3?.1:0)));
tl.to('.brk',{autoAlpha:1,scale:1,duration:.35,stagger:.05},26.6)
  .to(['#endline','.brk'],{y:-8,duration:.8,ease:'power2.inOut'},27.0)
  .to('#lockup',{autoAlpha:1,y:0,duration:.6,ease:'back.out(1.5)'},27.3);
typeOn($('#endurl'),C.endUrl,27.9,1.0);
sph2.forEach((s,i)=>tl.to(s,{rotation:i%2?6:-6,duration:4,ease:'none'},26.6));
tl.to({},{duration:.01},30);

window.__duration=30;
window.__seek=t=>{tl.seek(t,false)};
window.__ready=document.fonts.ready.then(()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=r)))).then(()=>true);
if(!navigator.webdriver){tl.play()}
</script>
</body></html>
